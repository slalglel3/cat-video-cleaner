name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/CatCleaner.apk
          ls -la build-output/

      - name: Sign APK with apksigner (v1 + v2)
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          KEYSTORE=~/.android/debug.keystore
          if [ ! -f $KEYSTORE ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore $KEYSTORE -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Signing APK with apksigner (v1 + v2)..."
          $APKSIGNER sign --ks $KEYSTORE --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true build-output/CatCleaner.apk
          echo "Verifying signed APK..."
          $APKSIGNER verify --verbose build-output/CatCleaner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatCleaner-apk
          path: build-output/CatCleaner.apk
          retention-days: 30

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name }}
          name: "CatCleaner ${{ github.ref_name }}"
          body: |
            ## 🐾 CatCleaner - 고양이 동영상 보컬 & TV 소리 제거기 v1.0.0
            
            - **100% 서버리스 온디바이스 구동**: 외부 서버 전송 없이 스마트폰 자체 연산
            - **TV 사람 목소리 억제**: 200Hz ~ 3,400Hz 음성 대역 선택적 상쇄
            - **고양이 움직임/발소리 보존**: 상자 긁는 소리, 솜방망이 타격 과도응답(Transient) 생생하게 부스트
            - **실시간 A/B 비교**: 원본 소리와 클린 소리를 탭 한 번으로 전환 청취
            - **클린 동영상(MP4) 즉시 저장**: 다운로드 후 스마트폰 갤러리에 저장 가능
            
            ### 📱 설치 안내
            - 아래 `CatCleaner.apk` 파일을 스마트폰에 다운로드하여 설치하십시오.
          draft: false
          prerelease: false
          files: |
            build-output/CatCleaner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
